name: CI/CD to EC2 via SSH

on:
  push:
    branches: [ main ]

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to EC2
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        # Add host key to known_hosts to avoid interactive prompt
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

        echo "Syncing files..."
        rsync -avz --exclude '.git' --exclude 'venv' --exclude '__pycache__' ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/api-service/current

        echo "Restarting service..."
        ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "cd /opt/api-service/current && source venv/bin/activate && pip install -r requirements.txt && sudo systemctl restart api-service"
