name: CI/CD to EC2 via SSH

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: backend-ec2-production
  cancel-in-progress: false

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to EC2
      run: |
        set -euxo pipefail
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        # Add host key to known_hosts to avoid interactive prompt
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

        echo "Syncing files..."
        rsync -avz --delete \
          --exclude '.git' \
          --exclude '.github' \
          --exclude 'venv' \
          --exclude '__pycache__' \
          --exclude '.env' \
          --exclude 'app.log' \
          ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/api-service/current/

        echo "Stamping deploy metadata..."
        printf '%s\n' \
          '{' \
          "  \"sha\": \"${GITHUB_SHA}\"," \
          "  \"deployed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"," \
          "  \"workflow\": \"${GITHUB_WORKFLOW}\"," \
          "  \"run_id\": \"${GITHUB_RUN_ID}\"," \
          "  \"actor\": \"${GITHUB_ACTOR}\"" \
          '}' > DEPLOY_INFO.json
        scp DEPLOY_INFO.json ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/api-service/current/DEPLOY_INFO.json

        echo "Installing dependencies, clearing app caches, and restarting service..."
        ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "\
          cd /opt/api-service/current && \
          venv/bin/pip install --upgrade -r requirements.txt && \
          find app -type d -name '__pycache__' -prune -exec rm -rf {} + && \
          sudo systemctl restart api-service && \
          systemctl is-active --quiet api-service"

        echo "Smoke testing deployed API..."
        ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "\
          for attempt in \$(seq 1 15); do \
            if curl -fsS http://127.0.0.1:8000/api/v1/health/; then \
              printf '\n--- recent service log ---\n' && \
              sudo journalctl -u api-service -n 40 --no-pager; \
              exit 0; \
            fi; \
            sleep 2; \
          done; \
          printf '\n--- recent service log ---\n' && \
          sudo journalctl -u api-service -n 80 --no-pager && \
          exit 1"
