name: CI/CD to EC2 via SSH

on:
  push:
    branches: [ main ]

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Debug SSH Connection
      run: |
        mkdir -p ~/.ssh
        echo "Registering private key..."
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        echo "Testing connection to ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}..."
        ssh -vvv -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "uptime"

    - name: Copy code to EC2
      uses: appleboy/scp-action@v0.1.2
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "."
        target: "/opt/api-service/current"

    - name: Restart Uvicorn service
      uses: appleboy/ssh-action@v0.1.7 
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /opt/api-service/current
          source venv/bin/activate
          pip install -r requirements.txt
          sudo systemctl restart uvicorn
